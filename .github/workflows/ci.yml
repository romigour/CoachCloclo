name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: Front (install, tests, build)
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
      - name: Tests Python
        run: uv run pytest
      - name: Build wheel
        run: uv build
      - name: Test de Invoke-Step (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/installers/check_ps_invoke.ps1
      - name: Installeur (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/coachcloclo-*.whl | Select-Object -First 1).FullName
          $env:COACH_SOURCE = $wheel
          $env:COACH_INSTALL_NO_START = '1'
          $env:COACH_INSTALL_OFFLINE = '1'
          ./install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          coach doctor --offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installeur (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          export COACH_SOURCE="$(ls "$PWD"/dist/coachcloclo-*.whl | head -n1)"
          export COACH_INSTALL_NO_START=1
          export COACH_INSTALL_OFFLINE=1
          bash install.sh
          export PATH="$HOME/.local/bin:$PATH"
          coach doctor --offline
      - name: Front servi par l'application installée
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export PYTHONUTF8=1
          export COACH_HOME="$RUNNER_TEMP/coach-home"
          coach start --no-browser --port 8799 >"$RUNNER_TEMP/coach.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8799/ -o "$RUNNER_TEMP/index.html"; then break; fi
            sleep 1
          done
          if ! grep -qi "<html" "$RUNNER_TEMP/index.html"; then
            echo "Front non servi ; journal du serveur :"; cat "$RUNNER_TEMP/coach.log"; exit 1
          fi
