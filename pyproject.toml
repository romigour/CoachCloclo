[project]
name = "coachcloclo"
version = "0.7.3"
description = "CoachCloclo : plans d'entraînement running/trail à partir des données Garmin avec Claude"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "pydantic>=2",
    "garminconnect[workout]>=0.3,<0.4",
    "gpxpy",
    "platformdirs",
    "typer",
    "anthropic",
    "python-multipart",
]

[project.scripts]
coach = "coach.cli:app"
coachcloclo = "coach.cli:app"

[dependency-groups]
dev = ["pytest", "httpx"]
desktop = ["pyinstaller", "pystray", "pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coach"]
artifacts = ["coach/web_dist/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["coach/web_dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: tests nécessitant Garmin/Claude réels (exclus par défaut)"]
