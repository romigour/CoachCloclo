name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: Front
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
      - name: Tests et wheel
        run: |
          set -euo pipefail
          uv run pytest
          uv build
          test -f coach/web_dist/index.html
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl --title "CoachCloclo $GITHUB_REF_NAME" --generate-notes
