name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: Front
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
      - name: Tests et wheel
        run: |
          set -euo pipefail
          uv run pytest
          uv build
          test -f coach/web_dist/index.html
      - name: Archive la wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error
      - name: Archive le front compilé
        uses: actions/upload-artifact@v4
        with:
          name: web_dist
          path: coach/web_dist/
          if-no-files-found: error

  windows:
    needs: build
    runs-on: windows-latest
    # garde-fou : un exe bloqué ne doit pas occuper le runner 6 h
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Récupère le front compilé
        uses: actions/download-artifact@v4
        with:
          name: web_dist
          path: coach/web_dist
      - name: Dépendances desktop
        run: uv sync --group desktop
      - name: Version du paquet
        id: version
        run: |
          $v = (uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if (-not $v) { throw "Version introuvable dans pyproject.toml" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version $v de pyproject.toml"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: PyInstaller
        run: uv run pyinstaller --noconfirm packaging/windows/coachcloclo.spec
      - name: Test de fumée
        run: |
          $env:COACH_HOME = Join-Path $env:RUNNER_TEMP 'coach-smoke'
          $p = Start-Process dist\CoachCloclo\CoachCloclo.exe -ArgumentList '--smoke', '--expect-version', '${{ steps.version.outputs.version }}' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $log = Join-Path $env:COACH_HOME 'logs\coachcloclo.log'
            if (Test-Path $log) { Get-Content $log }
            exit 1
          }
      - name: Inno Setup
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Somme de contrôle
        run: |
          $name = "CoachCloclo-Setup-${{ steps.version.outputs.version }}.exe"
          $exe = Join-Path 'packaging\windows\Output' $name
          if (-not (Test-Path $exe)) { throw "Installateur introuvable : $exe" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          $out = Join-Path (Resolve-Path 'packaging\windows\Output') "$name.sha256"
          [IO.File]::WriteAllText($out, "$hash  $name`n", [Text.Encoding]::ASCII)
      - name: Archive l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            packaging/windows/Output/CoachCloclo-Setup-*.exe
            packaging/windows/Output/CoachCloclo-Setup-*.exe.sha256
          if-no-files-found: error

  publish:
    needs: [build, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: wheel
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" wheel/*.whl installer/* --title "CoachCloclo $GITHUB_REF_NAME" --generate-notes
