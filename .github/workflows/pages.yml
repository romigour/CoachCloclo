name: Pages

# Publie le guide (commit déclencheur) et la version mobile (dernier tag v*).
on:
  push:
    tags: ["v*"]
    branches: [master]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Guide (Jekyll)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      # La version mobile est toujours construite depuis le dernier tag v*,
      # pour rester alignée avec le schéma de base de l'appli de bureau publiée.
      - uses: actions/checkout@v4
        with:
          path: release
          fetch-depth: 0
      - name: Dernier tag v* et prise en charge de build:mobile
        id: pwa
        run: |
          set -euo pipefail
          git -C release fetch --tags --force
          tag="$(git -C release tag --list 'v*' --sort=-v:refname | head -1)"
          if [ -z "$tag" ]; then
            echo "::warning::Aucun tag v* : version mobile ignorée, seul le guide est publié."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C release checkout "$tag"
          if node -e 'process.exit(require("./release/web/package.json").scripts?.["build:mobile"] ? 0 : 1)'; then
            echo "Version mobile construite depuis $tag"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Le tag $tag n'a pas de script build:mobile : version mobile ignorée, seul le guide est publié."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.pwa.outputs.build == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: release/web/package-lock.json
      # Un échec ici (tag avec build:mobile) est une vraie régression : le job échoue.
      - name: Build mobile
        if: steps.pwa.outputs.build == 'true'
        working-directory: release/web
        run: |
          set -euo pipefail
          npm ci
          npm run build:mobile
          test -f dist-mobile/index.html
      # jekyll-build-pages écrit _site en root (Docker) : on assemble dans un dossier neuf.
      - name: Assemble le site
        run: |
          set -euo pipefail
          mkdir public
          cp -r _site/. public/
          if [ "${{ steps.pwa.outputs.build }}" = "true" ]; then
            mkdir -p public/app
            cp -r release/web/dist-mobile/. public/app/
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
